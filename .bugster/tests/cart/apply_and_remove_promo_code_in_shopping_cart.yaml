name: Apply and remove promo code in shopping cart
page: Shopping Cart Page
page_path: app/cart/page.tsx
task: Verify users can apply and remove promo codes in the shopping cart
steps:
- Add a product to cart from the homepage
- Navigate to the cart page
- Verify promo code section is visible
- Enter an invalid promo code (e.g. 'INVALID')
- Click the Apply button
- Verify error toast appears for invalid code
- Enter a valid promo code (e.g. 'BUGSTER50')
- Click the Apply button
- Verify success toast appears confirming the promo code application
- Verify the applied promo code appears with discount information
- Verify order total reflects the applied discount
- Click the Remove button next to the promo code
- Verify promo code is removed
- Verify order total is recalculated without the discount
expected_result: Promo code should be successfully applied with a discount and can
  be removed
