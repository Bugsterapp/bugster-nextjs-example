name: View cart contents
page: /cart
page_path: app/cart/page.tsx
task: Verify users can view items in their shopping cart
steps:
- Add a product to cart from the homepage
- Navigate to the cart page
- Verify product appears in the cart list
- Verify product details (name, color, size, price) are correct
- Verify order summary section shows correct item count badge
- Verify estimated delivery date is displayed
- Verify subtotal calculation is correct
- Check if free delivery is applied for orders over $50
- Verify tax calculation (8% of subtotal)
- Verify total amount includes subtotal, shipping, discounts, and tax
expected_result: Cart page displays all added items with correct details, order summary
  with item count, pricing details including subtotal, shipping, tax, and dynamic
  elements like estimated delivery date
