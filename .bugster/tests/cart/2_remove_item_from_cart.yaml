name: Remove item from cart
page: /cart
page_path: app/cart/page.tsx
task: Verify users can remove items from their cart
steps:
- Add a product to cart from the homepage
- Navigate to the cart page
- Verify item count indicator shows correct number of items
- Click the remove button on a cart item
- Verify the item is removed from the cart
- Verify cart item count indicator is updated
- Verify subtotal is recalculated
- Verify tax amount is updated (8% of subtotal)
- "Verify shipping cost updates (free if subtotal \u2265 $50, otherwise $5.99)"
- Verify estimated delivery date is still visible if items remain in cart
- Verify order total reflects all changes
expected_result: Item is removed from cart, cart item count is updated, order summary
  is recalculated (subtotal, tax, shipping), and delivery eligibility is adjusted
  based on new cart total
