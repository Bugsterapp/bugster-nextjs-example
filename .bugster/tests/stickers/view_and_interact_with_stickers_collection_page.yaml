name: View and interact with stickers collection page
page: stickers
page_path: app/stickers/page.tsx
task: Verify that users can view the stickers collection and add a sticker to their
  cart
steps:
- Navigate to the stickers page
- Verify the page title 'Stickers Collection' is displayed
- Verify the page subtitle 'Discover our amazing collection of high-quality stickers'
  is displayed
- Verify that all 6 sticker products are displayed in a grid layout
- Click on a color option for the 'Circle Sticker Pack'
- Verify that the selected color is highlighted
- Click the 'Add to Cart' button on the 'Circle Sticker Pack' product card
- Verify that a success toast message appears indicating the item was added to the
  cart
expected_result: User should be able to view all sticker products, select a color,
  and successfully add a sticker to their cart
